<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Alumnos</title>
    <style>
        body { font-family: sans-serif; margin: 20px; color: #333; }
        .top { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        h1 { margin: 0; font-size: 1.4rem; }
        button { background: #2563eb; color: #fff; border: 0; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; border-bottom: 1px solid #ccc; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>

<div class="top">
    <h1>Consulta de alumnos</h1>
    <form th:action="@{/listar}" method="get">
        <button type="submit">Mostrar alumnos</button>
    </form>
</div>

<table th:if="${alumnos != null}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellidos</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="alumno : ${alumnos}">
        <td th:text="${alumno.id}"></td>
        <td th:text="${alumno.nombre}"></td>
        <td th:text="${alumno.apellidos}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
